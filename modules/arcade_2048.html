<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;padding:16px;font:14px system-ui;color:var(--tg-theme-text-color,#f4f5fa);background:var(--tg-theme-bg-color,#121524)}h1{font-size:21px;margin:0}header,.bar,.controls{display:flex;align-items:center;justify-content:space-between;gap:8px}.tag{font-size:11px;letter-spacing:2px;color:var(--tg-theme-hint-color,#9ca9c4)}button{font:inherit;color:inherit;border:0;min-height:44px;padding:8px 12px;border-radius:12px;background:var(--tg-theme-secondary-bg-color,#252c42);cursor:pointer}button:focus-visible{outline:3px solid #a99cff;outline-offset:2px}button:disabled{opacity:.45;cursor:default}.bar{margin-bottom:12px;font-size:13px}.hint{color:var(--tg-theme-hint-color,#a3adc4);line-height:1.5;font-size:12px;min-height:36px;margin:12px 0 0}.board{display:grid;gap:7px;touch-action:none;user-select:none}.merge{grid-template-columns:repeat(4,1fr);padding:7px;border-radius:16px;background:var(--tg-theme-secondary-bg-color,#20283d)}.tile{aspect-ratio:1;display:grid;place-items:center;border-radius:9px;font-weight:750;font-size:26px;background:#303a50;color:#fff}.tile[data-v="0"]{color:transparent;background:#46526a40}.tile[data-v="2"]{background:#d4dbea;color:#242e48}.tile[data-v="4"]{background:#acbcd8;color:#182442}.tile[data-v="8"]{background:#a899ed;color:#191831}.tile[data-v="16"]{background:#8976df}.tile[data-v="32"]{background:#d070ac}.tile[data-v="64"]{background:#d45d7b}.tile.high{background:#e7c566;color:#302810}.controls{margin-top:12px}.controls button{flex:1;padding:8px}#notice{margin-top:10px;font-weight:600;min-height:20px}[hidden]{display:none!important}@media(prefers-reduced-motion:no-preference){button:active{transform:scale(.96)}}
.accent{background:var(--tg-theme-button-color,#afa0ff);color:var(--tg-theme-button-text-color,#121524)}</style></head><body>
<header><div><span class="tag">JULIA ARCADE</span><h1>2048</h1></div></header>
<div class="bar"><strong id="score"></strong><span id="best"></span></div>
<section id="merge"><div class="board merge" id="merge-board" tabindex="0" aria-label="2048 board. Swipe or use arrow keys."></div><div class="controls"><button data-move="left" aria-label="Slide left">←</button><button data-move="up" aria-label="Slide up">↑</button><button data-move="down" aria-label="Slide down">↓</button><button data-move="right" aria-label="Slide right">→</button></div><p class="hint">Swipe or use arrows to merge equal tiles. Reach 2048, then keep going.</p></section>
<div id="notice" role="status" aria-live="polite"></div><div class="controls"><button id="restart" class="accent">New game</button><button id="undo">Undo</button></div>
<script>/* ARCADE_ENGINE */</script><script>(function(){'use strict';const A=Arcade,$=id=>document.getElementById(id);let game='2048',tiles,score=0,undo=null,ended=false,swipe=null;function reset(){score=0;undo=null;tiles=A.spawn(A.spawn(Array(16).fill(0)));draw2048()}
function notice(s){$('notice').textContent=s}
function best(v){try{const k='julia-arcade-'+game,n=Math.max(Number(localStorage.getItem(k))||0,v);localStorage.setItem(k,n);return n}catch(e){return v}}
function draw2048(){ $('score').textContent='Score '+score;$('best').textContent='Best '+best(score);$('undo').disabled=!undo;$('merge-board').replaceChildren(...tiles.map(v=>{const d=document.createElement('div');d.className='tile'+(v>=128?' high':'');d.dataset.v=v;d.textContent=v||'';if(v>=1024)d.style.fontSize='20px';return d}));ended=!A.canMove(tiles);notice(ended?'No moves left. Undo or start again.':tiles.some(v=>v>=2048)?'2048 reached! Keep going.':'')}
function move(d){if(game!=='2048'||ended)return;const m=A.slide(tiles,d);if(!m.changed)return;undo={tiles:tiles.slice(),score};tiles=A.spawn(m.board);score+=m.score;draw2048()}
document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>move(b.dataset.move));$('undo').onclick=()=>{if(undo){tiles=undo.tiles;score=undo.score;undo=null;draw2048()}};
$('merge-board').onpointerdown=e=>{swipe={x:e.clientX,y:e.clientY};e.currentTarget.setPointerCapture(e.pointerId)};$('merge-board').onpointercancel=()=>swipe=null;$('merge-board').onpointerup=e=>{if(!swipe)return;const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y;swipe=null;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;move(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')};
document.addEventListener('keydown',e=>{const d={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];if(d){e.preventDefault();move(d)}});
$('restart').onclick=reset;reset();if(window.TelegramWidget)TelegramWidget.ready();})();</script></body></html>
