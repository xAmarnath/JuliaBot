<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2048</title><style>/* ARCADE_STYLE */

.sizes{display:flex;gap:8px}.sizes button{font-size:12px;padding:6px;min-width:48px}.sizes [aria-pressed=true]{background:#c5b8f1;color:#28213f}.board{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px;padding:6px;border-radius:16px;background:var(--surface);touch-action:none;user-select:none}.tile{position:relative;aspect-ratio:1;min-width:0;border-radius:9px;background:#d5dced;color:#28334e;font-weight:750;line-height:1;text-align:center}.tile span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}.tile[data-v="0"]{background:#8796ac26}.tile[data-v="4"]{background:#b9cce3}.tile[data-v="8"]{background:#b9a8ed;color:#282044}.tile[data-v="16"]{background:#9681d7;color:#211639}.tile[data-v="32"]{background:#e29ac7;color:#401934}.tile[data-v="64"]{background:#ef95a4;color:#441b24}.tile.high{background:#ead080;color:#3c3012}@media(prefers-reduced-motion:no-preference){.tile.changed span{animation:pop .14s}}
</style></head><body><header><h1>2048</h1><div class="sizes" aria-label="Grid size"><button data-size="4">4&times;4</button><button data-size="5">5&times;5</button><button data-size="6">6&times;6</button></div></header>
<div class="stats"><div class="stat"><small>Score</small><strong id="score">0</strong></div><div class="stat"><small>Best</small><strong id="best">0</strong></div></div>
<div class="board" id="merge-board" tabindex="0" aria-label="2048 board. Swipe or use arrow keys."></div><div class="controls"><button data-move="left" aria-label="Slide left" title="Slide left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h12"/></svg></button><button data-move="up" aria-label="Slide up" title="Slide up"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 14 6-6 6 6M12 8v12"/></svg></button><button data-move="down" aria-label="Slide down" title="Slide down"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 10 6 6 6-6M12 16V4"/></svg></button><button data-move="right" aria-label="Slide right" title="Slide right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6M16 12H4"/></svg></button></div><p id="notice" role="status"></p><div class="controls"><button id="undo">Undo</button><button id="restart" class="accent">New game</button></div>
<script>/* ARCADE_ENGINE */</script><script>(function(){'use strict';const A=Arcade,$=id=>document.getElementById(id);

let n=4,tiles=[],score=0,undo=null,ended=false,swipe=null,record=0;
const key=()=> 'julia-2048-'+n;
function read(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function valid(b){return Array.isArray(b)&&b.length===n*n&&b.every(v=>Number.isSafeInteger(v)&&v>=0&&(v===0||v>=2&&Number.isInteger(Math.log2(v))))}
function reset(){score=0;undo=null;tiles=A.spawn(A.spawn(Array(n*n).fill(0)));draw()}
function select(size){n=size;save('julia-2048-size',n);const s=read(key());record=Number(s&&s.best)||0;if(s&&valid(s.tiles)&&Number.isSafeInteger(s.score)&&s.score>=0){tiles=s.tiles;score=s.score;undo=null;draw()}else reset()}
function draw(previous=[]){record=Math.max(record,score);$('score').textContent=score;$('best').textContent=record;$('undo').disabled=!undo;const board=$('merge-board');board.style.setProperty('--n',n);board.setAttribute('aria-label',n+' by '+n+' board. Swipe or use arrow keys.');board.replaceChildren(...tiles.map((v,i)=>{const d=document.createElement('div'),s=document.createElement('span');d.className='tile'+(v>=128?' high':'')+(v&&previous.length&&v!==previous[i]?' changed':'');d.dataset.v=v;s.textContent=v||'';s.style.fontSize=Math.min(28,Math.floor((270/n)/Math.max(2,String(v).length)*1.5))+'px';d.append(s);return d}));document.querySelectorAll('[data-size]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.size==n));ended=!A.canMove(tiles);$('notice').textContent=ended?'No moves left. Undo or start again.':tiles.some(v=>v>=2048)?'2048 reached. Keep going!':'';save(key(),{tiles,score,best:record})}
function move(d){if(ended)return;const m=A.slide(tiles,d);if(!m.changed)return;undo={tiles:tiles.slice(),score};tiles=A.spawn(m.board);score+=m.score;draw(undo.tiles)}
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{if(n!=b.dataset.size)select(Number(b.dataset.size))});
document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>move(b.dataset.move));$('undo').onclick=()=>{if(undo){tiles=undo.tiles;score=undo.score;undo=null;draw()}};
$('merge-board').onpointerdown=e=>{if(!e.isPrimary||e.button!==0)return;swipe={x:e.clientX,y:e.clientY};e.currentTarget.setPointerCapture(e.pointerId)};$('merge-board').onpointercancel=()=>swipe=null;$('merge-board').onpointerup=e=>{if(!swipe||!e.isPrimary)return;const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y;swipe=null;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;move(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')};
document.addEventListener('keydown',e=>{const d={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];if(d){e.preventDefault();move(d)}});
$('restart').onclick=reset;const size=read('julia-2048-size');select([4,5,6].includes(size)?size:4);

if(window.TelegramWidget)TelegramWidget.ready();})();</script></body></html>
