<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tic-tac-toe</title><style>/* ARCADE_STYLE */

.players{font-size:12px;display:flex;gap:12px;color:var(--muted)}.players b{color:var(--ink)}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.board button{aspect-ratio:1;padding:0;display:grid;place-items:center;border-radius:16px}.board svg{width:42%;height:42%;stroke-width:1.8}.board button:disabled{opacity:1}.board .o{color:#b4a1ed}.board .win{background:#c5b8f1;color:#28213f}.board .x{color:var(--ink)}.board .win.x{color:#28213f}.board button:disabled:empty{opacity:.5}@media(prefers-reduced-motion:no-preference){.board svg{animation:pop .16s}}
</style></head><body><header><h1>Tic-tac-toe</h1><div class="players"><span><b>X</b> You</span><span><b>O</b> CPU</span></div></header><div class="board" id="ttt-board" aria-label="Tic-tac-toe board"></div><p id="notice" role="status"></p><div class="controls"><button id="restart" class="accent">New game</button></div>
<script>/* ARCADE_ENGINE */</script><script>(function(){'use strict';const A=Arcade,$=id=>document.getElementById(id);

let board,ended=false,thinking=false,timer;
const cells=Array.from({length:9},(_,i)=>{const b=document.createElement('button');b.onclick=()=>play(i);$('ttt-board').append(b);return b});
function reset(){clearTimeout(timer);board=Array(9).fill('');ended=false;thinking=false;draw()}
function draw(){const result=A.winner(board);ended=!!result;const win=A.lines.find(l=>board[l[0]]&&l.every(i=>board[i]===board[l[0]]))||[];cells.forEach((b,i)=>{const v=board[i];b.disabled=!!v||ended||thinking;b.className=v.toLowerCase()+(win.includes(i)?' win':'');b.setAttribute('aria-label','Row '+(1+Math.floor(i/3))+', column '+(i%3+1)+(v?', '+v:', empty'));if(b.dataset.v!==v){b.dataset.v=v;b.innerHTML=v?'<svg viewBox="0 0 24 24" aria-hidden="true">'+(v==='X'?'<path d="m6 6 12 12M18 6 6 18"/>':'<circle cx="12" cy="12" r="7"/>')+'</svg>':''}});$('notice').textContent=result==='draw'?'Draw. Well played.':result==='X'?'You win!':result==='O'?'The machine wins. Try again.':thinking?'Machine is thinking…':'Your turn'}
function play(i){if(ended||thinking||board[i])return;board[i]='X';thinking=!A.winner(board);draw();if(thinking)timer=setTimeout(()=>{const j=A.bestMove(board);if(j>=0)board[j]='O';thinking=false;draw()},180)}
$('restart').onclick=reset;reset();

if(window.TelegramWidget)TelegramWidget.ready();})();</script></body></html>
