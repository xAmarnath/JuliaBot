<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;padding:16px;font:14px system-ui;color:var(--tg-theme-text-color,#f4f5fa);background:var(--tg-theme-bg-color,#121524)}h1{font-size:21px;margin:0}header,.bar,.controls{display:flex;align-items:center;justify-content:space-between;gap:8px}.tag{font-size:11px;letter-spacing:2px;color:var(--tg-theme-hint-color,#9ca9c4)}button{font:inherit;color:inherit;border:0;min-height:44px;padding:8px 12px;border-radius:12px;background:var(--tg-theme-secondary-bg-color,#252c42);cursor:pointer}button:focus-visible{outline:3px solid #a99cff;outline-offset:2px}button:disabled{opacity:.45;cursor:default}.bar{margin-bottom:12px;font-size:13px}.hint{color:var(--tg-theme-hint-color,#a3adc4);line-height:1.5;font-size:12px;min-height:36px;margin:12px 0 0}.board{display:grid;gap:7px;touch-action:none;user-select:none}.ttt{grid-template-columns:repeat(3,1fr)}.ttt button{height:88px;font-size:38px;font-weight:700}.ttt button.o{color:#ae9eff}.controls{margin-top:12px}.controls button{flex:1;padding:8px}#notice{margin-top:10px;font-weight:600;min-height:20px}[hidden]{display:none!important}@media(prefers-reduced-motion:no-preference){button:active{transform:scale(.96)}}
.accent{background:var(--tg-theme-button-color,#afa0ff);color:var(--tg-theme-button-text-color,#121524)}</style></head><body>
<header><div><span class="tag">JULIA ARCADE</span><h1>Tic-tac-toe</h1></div></header>
<div class="bar"><strong id="score"></strong><span id="best"></span></div>
<section id="ttt"><div class="board ttt" id="ttt-board" aria-label="Tic-tac-toe board"></div><p class="hint">Tap a square. Get three in a row against the machine. Can you hold it to a draw?</p></section>
<div id="notice" role="status" aria-live="polite"></div><div class="controls"><button id="restart" class="accent">New game</button></div>
<script>/* ARCADE_ENGINE */</script><script>(function(){'use strict';const A=Arcade,$=id=>document.getElementById(id);let game='ttt',ttt,ended=false;function reset(){ttt=Array(9).fill('');ended=false;notice('Your turn');drawTTT()}
function notice(s){$('notice').textContent=s}
function best(v){try{const k='julia-arcade-'+game,n=Math.max(Number(localStorage.getItem(k))||0,v);localStorage.setItem(k,n);return n}catch(e){return v}}
function drawTTT(){ $('score').textContent='You are X';$('best').textContent='Machine is O';$('ttt-board').replaceChildren(...ttt.map((v,i)=>{const b=document.createElement('button');b.textContent=v;b.className=v==='O'?'o':'';b.disabled=!!v||ended;b.setAttribute('aria-label','Row '+(1+Math.floor(i/3))+', column '+(i%3+1)+(v?', '+v:', empty'));b.onclick=()=>{if(ended||ttt[i])return;ttt[i]='X';if(!A.winner(ttt)){const j=A.bestMove(ttt);if(j>=0)ttt[j]='O'}const result=A.winner(ttt);ended=!!result;notice(result==='draw'?'A perfect draw. Play again?':result==='X'?'You win!':result==='O'?'The machine wins. Try again.':'Your turn');drawTTT()};return b}))}

$('restart').onclick=reset;reset();if(window.TelegramWidget)TelegramWidget.ready();})();</script></body></html>
