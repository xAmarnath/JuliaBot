<!doctype html><html><head><style>
*{box-sizing:border-box}body{margin:0;padding:12px;font:14px system-ui;color:#fff;background:#1f1f1f}
.brand,.line,.pages,.links{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-size:10px;letter-spacing:2px;font-weight:800}.brand span{background:#f5c518;color:#000;border-radius:5px;padding:4px 7px;letter-spacing:0;font-size:12px}
.hero{padding:10px 0 8px;border-bottom:1px solid #ffffff33}h1{font-size:23px;line-height:26px;letter-spacing:-.5px;margin:0 0 7px;font-weight:800;overflow-wrap:break-word;max-height:52px;overflow:hidden;display:block}.muted{color:#b3b3b3}#meta{font-size:12px;line-height:17px;max-height:34px;overflow:hidden}#score{margin-top:10px;font-size:12px}#rating{font-size:20px;font-weight:800;margin-right:5px}#votes{margin-left:10px}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;margin-top:10px}button,a{font:inherit;-webkit-tap-highlight-color:transparent}button{cursor:pointer;min-height:44px;border:0;border-radius:4px;background:#313131;color:inherit;padding:10px;font-size:12px;font-weight:600}button:active,a:active{opacity:.65}button[disabled]{opacity:.45;cursor:default}.tabs button{padding:8px 2px}.tabs .selected{background:#f5c518;color:#000}
#section{font-size:10px;letter-spacing:1.4px;font-weight:700;text-transform:uppercase;margin-top:10px;color:#f5c518;border-left:3px solid #f5c518;padding-left:7px}#body{white-space:pre-wrap;overflow-wrap:break-word;font-size:13px;line-height:20px;margin:8px 0 12px}.choice{display:flex;align-items:center;text-align:left;width:100%;gap:10px;margin-top:5px;min-height:50px;padding:8px 10px}.choice .num{font-size:12px;color:#b3b3b3;font-weight:400}.choice .copy{flex:1;min-width:0}.choice strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.choice small{display:block;font-size:11px;margin-top:3px;color:#b3b3b3}.arrow{color:#b3b3b3}
.pages{margin-top:8px}.pages button{min-width:64px}.pages span{font-size:11px}.links{margin-top:8px;flex-wrap:wrap}.links a,.links button{flex:1;text-align:center;font-size:12px;min-height:44px;padding:13px 8px;border-radius:4px;text-decoration:none;color:#5799ef;background:#313131}#back,#retry{width:100%;margin-top:8px}#retry{background:#f5c518;color:#000}#notice{font-size:12px;line-height:17px;margin-top:8px}.footer{font-size:10px;margin-top:6px;letter-spacing:.4px}#notice:not(:empty)+.footer{display:none}.hide{display:none!important}
@media(max-width:300px){body{padding:12px}h1{font-size:20px}.tabs button{font-size:11px}.links{gap:4px}}
</style></head><body>
<div class="brand"><span>IMDb</span> JULIA / CINEMA</div>
<div class="hero"><h1 id="title">Your next great watch</h1><div id="meta" class="muted">Discover a story worth your time.</div><div id="score"><svg width="18" height="18" viewBox="0 0 24 24" style="vertical-align:-1px;margin-right:6px" aria-hidden="true"><path fill="#f5c518" d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01Z"/></svg><span id="rating"></span><span class="muted">/ 10</span><span id="votes" class="muted"></span></div></div>
<div id="tabs" class="tabs"></div><div id="section">DISCOVER</div><div id="body"></div><div id="rows"></div>
<div id="pages" class="pages"><button id="prev">Previous</button><span id="page" class="muted"></span><button id="next">Next</button></div>
<div id="links" class="links"><a id="imdb" href="https://www.imdb.com/">IMDb ↗</a><a id="trailer" href="https://www.imdb.com/">Trailer ↗</a><button id="poster">View poster</button></div>
<button id="back">Back to browsing</button><button id="retry">Retry</button><div id="notice" class="muted"></div><div class="footer muted">FILMS, SERIES &amp; EVERYTHING BETWEEN.</div>
<script>
var W=window.TelegramWidget,S={},pending=false,waiting=0,timer;
function el(id){return document.getElementById(id)}function txt(id,s){el(id).textContent=s||''}function show(id,b){el(id).className=el(id).className.replace(/\s*hide/g,'')+(b?'':' hide')}
var tabs=[['overview','Overview'],['story','Story'],['cast','Cast'],['facts','Facts'],['similar','Similar']];
function blocked(){return !W||!W.viewer||W.isPreview||W.isForward}
function request(action){if(pending||blocked())return;waiting=S.rev;pending=true;txt('notice','Loading…');draw();
 timer=setTimeout(function(){pending=false;draw();txt('notice','This is taking longer than expected. Try again, or send /imdb.');},55000);
 W.request('cinema:'+S.rev+':'+action).then(function(answer){var r={};try{r=JSON.parse(answer.result)||{}}catch(e){}if(!r.ok){pending=false;clearTimeout(timer);draw();txt('notice',r.message||'Please try again.')}else if(S.rev!==waiting){pending=false;clearTimeout(timer);draw()}},function(e){pending=false;clearTimeout(timer);draw();txt('notice','Could not reach the bot ('+(e.code||'FAILED')+'). Try again.');});}
function draw(){var title=S.mode==='title',list=S.mode==='list';txt('title',S.title);txt('meta',S.meta);txt('rating',S.rating);txt('votes',S.votes);show('score',!!S.rating);txt('body',S.body);show('body',!!S.body);txt('section',title?(S.tab==='similar'?'More like this':S.tab):list?'Pick a title':S.mode==='error'?'Try again shortly':'Finding your story');
 show('tabs',title);el('tabs').textContent='';tabs.forEach(function(t){var b=document.createElement('button');b.textContent=t[1];b.className=S.tab===t[0]?'selected':'';b.disabled=pending||blocked();b.addEventListener('click',function(){request(t[0])});el('tabs').appendChild(b)});
 el('rows').textContent='';(S.rows||[]).forEach(function(r,i){var b=document.createElement('button');b.className='choice';b.disabled=pending||blocked();var n=document.createElement('span');n.className='num';n.textContent=('0'+(S.page*(S.tab==='similar'?2:3)+i+1)).slice(-2);var copy=document.createElement('span');copy.className='copy';var h=document.createElement('strong');h.textContent=r.t;var m=document.createElement('small');m.textContent=r.m||'View details';copy.appendChild(h);copy.appendChild(m);var a=document.createElement('span');a.className='arrow';a.textContent='›';b.appendChild(n);b.appendChild(copy);b.appendChild(a);b.addEventListener('click',function(){request(r.a)});el('rows').appendChild(b)});
 show('pages',S.pages>1);txt('page',(S.page+1)+' / '+S.pages);el('prev').disabled=pending||blocked()||!S.page;el('next').disabled=pending||blocked()||S.page+1>=S.pages;
 show('links',title);if(title)el('imdb').setAttribute('href','https://www.imdb.com/title/'+S.id+'/');show('trailer',!!S.trailer);if(S.trailer)el('trailer').setAttribute('href','https://www.imdb.com/video/'+S.trailer+'/');txt('poster',S.poster?'Poster sent':'View poster');el('poster').disabled=pending||blocked()||S.poster;show('back',title&&S.back);el('back').disabled=pending||blocked();show('retry',S.mode==='error');el('retry').disabled=pending||blocked();
 if(blocked())txt('notice','Open /imdb in a private chat with the bot to explore.');}
['prev','next','poster','back','retry'].forEach(function(id){el(id).addEventListener('click',function(){request(id)})});
function changed(){try{S=JSON.parse(W.chatData)||{}}catch(e){S={mode:'error',title:'Open /imdb to begin'}}if(S.rev!==waiting){pending=false;clearTimeout(timer);txt('notice','')}draw()}
if(W){W.onEvent('chatDataChanged',changed);changed();W.ready()}
</script></body></html>
