<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;padding:16px;font:14px system-ui;color:var(--tg-theme-text-color,#f4f5fa);background:var(--tg-theme-bg-color,#121524)}h1{font-size:21px;margin:0}header,.bar,.controls{display:flex;align-items:center;justify-content:space-between;gap:8px}.tag{font-size:11px;letter-spacing:2px;color:var(--tg-theme-hint-color,#9ca9c4)}button{font:inherit;color:inherit;border:0;min-height:44px;padding:8px 12px;border-radius:12px;background:var(--tg-theme-secondary-bg-color,#252c42);cursor:pointer}button:focus-visible{outline:3px solid #a99cff;outline-offset:2px}button:disabled{opacity:.45;cursor:default}.bar{margin-bottom:12px;font-size:13px}.hint{color:var(--tg-theme-hint-color,#a3adc4);line-height:1.5;font-size:12px;min-height:36px;margin:12px 0 0}.board{display:grid;gap:7px;touch-action:none;user-select:none}.controls{margin-top:12px}.controls button{flex:1;padding:8px}canvas{display:block;margin:auto;width:200px;height:320px;border-radius:10px;background:#171d2e;touch-action:none}.next{display:flex;gap:8px;align-items:center}#next{width:44px;height:28px;border-radius:4px}#notice{margin-top:10px;font-weight:600;min-height:20px}[hidden]{display:none!important}@media(prefers-reduced-motion:no-preference){button:active{transform:scale(.96)}}
.accent{background:var(--tg-theme-button-color,#afa0ff);color:var(--tg-theme-button-text-color,#121524)}</style></head><body>
<header><div><span class="tag">JULIA ARCADE</span><h1>Falling blocks</h1></div></header>
<div class="bar"><strong id="score"></strong><span id="best"></span></div>
<section id="blocks"><div class="bar"><span id="level">Level 1</span><span class="next">Next <canvas id="next" width="88" height="56" aria-label="Next block"></canvas></span></div><canvas id="block-board" width="200" height="320" tabindex="0" aria-label="Falling blocks board"></canvas><div class="controls"><button data-block="left" aria-label="Move left">←</button><button data-block="rotate" aria-label="Rotate block">↻</button><button data-block="right" aria-label="Move right">→</button><button data-block="drop" aria-label="Drop block">⇓</button></div><p class="hint">Fill rows to clear them. Arrows move/rotate, Space drops. Games pause when you leave this card.</p></section>
<div id="notice" role="status" aria-live="polite"></div><div class="controls"><button id="restart" class="accent">New game</button><button id="pause">Resume</button></div>
<script>/* ARCADE_ENGINE */</script><script>(function(){'use strict';const A=Arcade,$=id=>document.getElementById(id);let game='blocks',score=0,ended=false,board,piece,next,x,y,lines=0,paused=true,bag=[],last=0,timer=null;const colors=['','#72b9e6','#e4ca6d','#a997ed','#83caaa','#dc87a8','#87a0e0','#dca570'];function reset(){stop();score=0;ended=false;board=Array.from({length:16},()=>Array(10).fill(0));bag=[];lines=0;next=pick();newPiece();drawBlocks();notice('Tap Resume to start.')}
function notice(s){$('notice').textContent=s}
function best(v){try{const k='julia-arcade-'+game,n=Math.max(Number(localStorage.getItem(k))||0,v);localStorage.setItem(k,n);return n}catch(e){return v}}
function pick(){if(!bag.length){bag=[0,1,2,3,4,5,6];for(let i=6;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}}return A.shapes[bag.pop()].map(r=>r.slice())}
function newPiece(){piece=next;next=pick();x=Math.floor((10-piece[0].length)/2);y=0;if(!A.fits(board,piece,x,y)){ended=true;paused=true;notice('Game over. Score '+score+'. Try again.')}}
function step(){if(A.fits(board,piece,x,y+1))y++;else{const r=A.lock(board,piece,x,y);board=r.board;score+=[0,100,300,500,800][r.cleared]*(1+Math.floor(lines/10));lines+=r.cleared;newPiece()}drawBlocks()}
function blockAction(action){if(game!=='blocks'||paused||ended)return;if(action==='left'&&A.fits(board,piece,x-1,y))x--;if(action==='right'&&A.fits(board,piece,x+1,y))x++;if(action==='rotate'){const p=A.rotate(piece);for(const dx of [0,-1,1,-2,2])if(A.fits(board,p,x+dx,y)){piece=p;x+=dx;break}}if(action==='down')step();if(action==='drop'){while(A.fits(board,piece,x,y+1)){y++;score+=2}step();last=performance.now()}drawBlocks()}
function cells(ctx,shape,ox,oy,size,alpha=1){ctx.globalAlpha=alpha;shape.forEach((row,dy)=>row.forEach((v,dx)=>{if(v){ctx.fillStyle=colors[v];ctx.fillRect((ox+dx)*size+1,(oy+dy)*size+1,size-2,size-2)}}));ctx.globalAlpha=1}
function drawBlocks(){const c=$('block-board').getContext('2d');c.clearRect(0,0,200,320);c.strokeStyle='#ffffff08';for(let i=0;i<=10;i++){c.beginPath();c.moveTo(i*20,0);c.lineTo(i*20,320);c.stroke()}cells(c,board,0,0,20);if(!ended){let ghost=y;while(A.fits(board,piece,x,ghost+1))ghost++;cells(c,piece,x,ghost,20,.22);cells(c,piece,x,y,20)}const n=$('next').getContext('2d');n.clearRect(0,0,88,56);cells(n,next,0,0,14);$('score').textContent='Score '+score;$('best').textContent='Best '+best(score);$('level').textContent='Level '+(1+Math.floor(lines/10))+' · '+lines+' lines';$('pause').textContent=paused?'Resume':'Pause';$('pause').disabled=ended}
function stop(){paused=true;clearTimeout(timer);timer=null}
function tick(){timer=null;if(paused||ended)return;step();if(!ended)timer=setTimeout(tick,Math.max(100,700-Math.floor(lines/10)*65))}
document.querySelectorAll('[data-block]').forEach(b=>b.onclick=()=>blockAction(b.dataset.block));$('pause').onclick=()=>{if(ended)return;if(paused){paused=false;timer=setTimeout(tick,700)}else stop();notice(paused?'Paused':'');drawBlocks()};
document.addEventListener('keydown',e=>{const d={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'rotate',ArrowDown:'down'}[e.key];if(d){e.preventDefault();blockAction(d)}if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();blockAction('drop')}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();notice('Paused');drawBlocks()}});
$('restart').onclick=reset;reset();if(window.TelegramWidget)TelegramWidget.ready();})();</script></body></html>
