<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tetris</title><style>/* ARCADE_STYLE */

.stage{display:flex;gap:12px;justify-content:center}.field{position:relative;width:200px;max-width:calc(100% - 64px)}canvas{display:block;background:#101724;border-radius:10px}#block-board{width:100%;height:auto;touch-action:none}aside{width:52px;text-align:center}aside strong{display:block;font-size:20px;margin:2px 0 16px}#next{width:52px;height:48px;margin:6px 0 20px}#cover{position:absolute;inset:0;width:100%;background:#101724c9;color:#edf0f8;font-size:20px;border-radius:10px}.controls [data-block]{padding:10px 0;touch-action:none;user-select:none}
</style></head><body><header><h1>Tetris</h1></header><div class="stats"><div class="stat"><small>Score</small><strong id="score">0</strong></div><div class="stat"><small>Best</small><strong id="best">0</strong></div></div><div class="stage"><div class="field"><canvas id="block-board" width="400" height="800" tabindex="0" aria-label="Tetris board. Arrows move and rotate, Space drops, P pauses."></canvas><button id="cover">Play</button></div><aside><small>Next</small><canvas id="next" width="104" height="96" aria-label="Next block"></canvas><small>Level</small><strong id="level">1</strong><small>Lines</small><strong id="lines">0</strong></aside></div><div class="controls"><button data-block="left" aria-label="Move left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h12"/></svg></button><button data-block="rotate" aria-label="Rotate"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 8a8 8 0 1 0 0 8M20 3v5h-5"/></svg></button><button data-block="right" aria-label="Move right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6M16 12H4"/></svg></button><button data-block="down" aria-label="Soft drop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 10 6 6 6-6M12 16V4"/></svg></button><button data-block="drop" aria-label="Hard drop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 20h14"/></svg></button></div><div class="controls"><button id="restart">New game</button><button id="pause" class="accent">Play</button></div><p id="notice" role="status"></p>
<script>/* ARCADE_ENGINE */</script><script>(function(){'use strict';const A=Arcade,$=id=>document.getElementById(id);

let score=0,record=0,ended=false,board,piece,next,x,y,lines=0,paused=true,started=false,bag=[],fall=0,land=0,resets=0,timer=null,hold=null;
const colors=['','#72b9e6','#e4ca6d','#a997ed','#83caaa','#dc87a8','#87a0e0','#dca570'];
try{record=Number(localStorage.getItem('julia-arcade-blocks'))||0}catch(e){}
function reset(play=false){stop();score=0;ended=false;started=false;board=Array.from({length:20},()=>Array(10).fill(0));bag=[];lines=0;next=pick();newPiece();if(play)toggle();else draw()}
function pick(){if(!bag.length){bag=[0,1,2,3,4,5,6];for(let i=6;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}}return A.shapes[bag.pop()].map(r=>r.slice())}
function newPiece(){piece=next;next=pick();x=Math.floor((10-piece[0].length)/2);y=0;land=0;resets=0;fall=performance.now();if(!A.fits(board,piece,x,y)){ended=true;stop()}}
function settle(){const r=A.lock(board,piece,x,y);board=r.board;score+=[0,100,300,500,800][r.cleared]*(1+Math.floor(lines/10));lines+=r.cleared;newPiece()}
function action(a){if(paused||ended)return;let moved=false;if(a==='left'||a==='right'){const dx=a==='left'?-1:1;if(A.fits(board,piece,x+dx,y)){x+=dx;moved=true}}if(a==='rotate'){const p=A.rotateAt(board,piece,x,y);if(p){piece=p.shape;x=p.x;y=p.y;moved=true}}if(moved&&land&&resets<15){land=performance.now();resets++}if(a==='down'&&A.fits(board,piece,x,y+1)){y++;score++;fall=performance.now()}if(a==='drop'){while(A.fits(board,piece,x,y+1)){y++;score+=2}settle()}draw()}
function cells(ctx,shape,ox,oy,size,ghost=false){shape.forEach((row,dy)=>row.forEach((v,dx)=>{if(v){const px=(ox+dx)*size+2,py=(oy+dy)*size+2;ctx.fillStyle=colors[v];ctx.strokeStyle=colors[v];if(ghost){ctx.globalAlpha=.45;ctx.lineWidth=2;ctx.strokeRect(px+1,py+1,size-6,size-6);ctx.globalAlpha=1}else{ctx.fillRect(px,py,size-4,size-4);ctx.fillStyle='#ffffff35';ctx.fillRect(px,py,size-4,3)}}}))}
function draw(){const c=$('block-board').getContext('2d');c.clearRect(0,0,400,800);c.fillStyle='#ffffff12';for(let j=1;j<20;j++)for(let i=1;i<10;i++)c.fillRect(i*40-1,j*40-1,2,2);cells(c,board,0,0,40);if(!ended){let g=y;while(A.fits(board,piece,x,g+1))g++;cells(c,piece,x,g,40,true);cells(c,piece,x,y,40)}const n=$('next').getContext('2d');n.clearRect(0,0,104,96);cells(n,next,(104/22-next[0].length)/2,(96/22-next.length)/2,22);$('score').textContent=score;if(score>record){record=score;try{localStorage.setItem('julia-arcade-blocks',record)}catch(e){}}$('best').textContent=record;$('level').textContent=1+Math.floor(lines/10);$('lines').textContent=lines;$('pause').textContent=paused?started?'Resume':'Play':'Pause';$('pause').disabled=ended;$('cover').hidden=!paused;$('cover').textContent=ended?'Game over · Play again':started?'Paused · Resume':'Play';$('notice').textContent=ended?'Game over. Score '+score:'';document.querySelectorAll('[data-block]').forEach(b=>b.disabled=paused||ended)}
function release(){clearTimeout(hold);hold=null}
function stop(){paused=true;clearTimeout(timer);timer=null;release()}
function tick(){if(paused||ended)return;const now=performance.now();let changed=false;if(now-fall>=Math.max(90,700-Math.floor(lines/10)*60)){if(A.fits(board,piece,x,y+1)){y++;changed=true}fall=now}if(!A.fits(board,piece,x,y+1)){land=land||now;if(now-land>=450){settle();changed=true}}else land=0;if(changed)draw();if(!paused&&!ended)timer=setTimeout(tick,40)}
function toggle(){if(ended)return;if(paused){paused=false;started=true;fall=performance.now();land=0;timer=setTimeout(tick,40)}else stop();draw()}
document.querySelectorAll('[data-block]').forEach(b=>{const a=b.dataset.block;b.onclick=()=>action(a);if(['left','right','down'].includes(a)){b.onpointerdown=e=>{if(!e.isPrimary||e.button!==0||paused)return;e.preventDefault();b.setPointerCapture(e.pointerId);release();action(a);hold=setTimeout(function repeat(){action(a);if(!paused)hold=setTimeout(repeat,70)},220)};b.onclick=e=>{if(e.detail===0)action(a)};b.onpointerup=b.onpointercancel=b.onlostpointercapture=release}});
$('pause').onclick=toggle;$('cover').onclick=()=>{if(ended)reset(true);else toggle()};$('restart').onclick=()=>reset(true);
document.addEventListener('keydown',e=>{const a={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'rotate',ArrowDown:'down',' ':'drop'}[e.key];if(a){e.preventDefault();if(!e.repeat||!['drop','rotate'].includes(a))action(a)}if(e.key.toLowerCase()==='p'&&!e.repeat){e.preventDefault();toggle()}});
function suspend(){if(!paused){stop();draw()}}document.addEventListener('visibilitychange',()=>{if(document.hidden)suspend()});window.addEventListener('blur',suspend);reset();

if(window.TelegramWidget)TelegramWidget.ready();})();</script></body></html>
